<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Jyzrox Web Clipper</title><style>body{font:14px system-ui;max-width:560px;margin:40px auto;padding:0 20px}label,input,button{display:block;width:100%;box-sizing:border-box}input{margin:8px 0 16px;padding:10px}button{padding:10px}#status{margin-top:12px}</style></head>
